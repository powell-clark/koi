name: ci

# Fast cross-platform check for the logic crates (no GUI/webkit deps).
# This is the "do the ported monitors compile and pass on macOS and Windows"
# signal, and it runs on every trigger — pull requests included — so
# cross-platform breakage is caught before merge rather than after it.
#
# Docs-only changes skip the Rust builds (see paths-ignore below) — they cannot
# affect compilation or tests.

on:
  push:
    branches: [main, dev]
    # Skip Rust builds for docs-only pushes to main.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
  pull_request:
    # Skip the ubuntu PR check for docs-only pull requests.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
  workflow_dispatch:
    # Manual dispatch always runs — no path restrictions.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every trigger runs all three OSes. This repo is public, and GitHub
        # Actions standard runners — macOS and Windows included — are free for
        # public repositories; the ~10x macOS multiplier is private-repo
        # billing. An earlier version restricted pull requests to ubuntu to
        # save minutes that were never being charged, which bought nothing and
        # let cross-platform breakage reach main unverified.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Toolchain version comes from rust-toolchain.toml (pinned for
      # reproducibility); components are added on top.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo deps
        uses: Swatinem/rust-cache@v2
        with:
          # Logic crates only — keyed separately from the tray bundle cache.
          key: logic-${{ matrix.os }}

      # rustfmt is platform-independent — only need to check it once.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p koi-core -p koi-cli -p koi-daemon -p koi-plugins --all-targets -- -D warnings

      - name: Test
        run: cargo test -p koi-core -p koi-cli -p koi-daemon -p koi-plugins

