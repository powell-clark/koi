name: secret-scan

# Scans the full repository for leaked secrets on every push to main and
# on every pull request.  No paths-ignore is applied because a secret can
# appear in any file — docs, config, and every other tracked path included.
#
# Uses the official gitleaks GitHub Action (gitleaks/gitleaks-action@v2),
# which reads .gitleaks.toml from the repo root automatically.  The action
# downloads a pinned gitleaks binary, scans the repository with full history,
# and fails the job on any finding not covered by the allowlist.
#
# This is the ongoing CI regression gate: it provides continuous
# security-by-design coverage of every tracked path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: detect secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for git-log scan mode

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # .gitleaks.toml is picked up automatically from the repo root.
        # Allowlisted paths (target/, .env.local) are defined there.
