# Wire the health check to its outside watcher (TASK-KOI253).
#
# A drop-in rather than an edit to the unit, so the template stays the operator's
# and this can be removed by deleting one file.
[Unit]
OnFailure=koi-health-check-notify.service

# OnFailureJobMode matters here, and the default would have been wrong.
#
# TASK-KOI192 recorded this exact failure on the backup's equivalent edge:
#   "Failed to enqueue OnFailure= job, ignoring: Transaction for
#    koi-backup-notify.service/start is destructive
#    (koi-backup.timer has 'stop' job queued)"
#
# That happens when the failure coincides with a shutdown, where systemd already
# has stop jobs queued and refuses to add a start job that would conflict. The
# notification is then dropped silently — a watcher that goes quiet in precisely
# the situation it exists for. replace-irreversibly tells systemd to enqueue the
# notification even against those pending stop jobs.
OnFailureJobMode=replace-irreversibly
